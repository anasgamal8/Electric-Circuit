<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electric Circuit Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Electric Circuits</h1>

    <div class="box">
        <h3>1) Ohm's Law</h3>
        <form id="ohm-form">
            <label for="ohm-v">V (volt)</label>
            <br>
            <input type="number" id="ohm-v">
            <br>

            <label for="ohm-i">I (amp)</label>
            <br>
            <input type="number" id="ohm-i">
            <br>

            <label for="ohm-r">R (ohm)</label>
            <br>
            <input type="number" id="ohm-r">
            <br>

            <button type="submit">Calculate</button>
        </form>
        <p id="ohm-result">ohm-result</p>
    </div>

    <div class="box">
        <h3>2) Series RLC circuit</h3>
        <form id="rlc-form">
            <label for="rlc-r">R (ohm)</label>
            <br>
            <input type="number" id="rlc-r">
            <br>

            <label for="rlc-l">L (mH)</label>
            <br>
            <input type="number" id="rlc-l">
            <br>

            <label for="rlc-c">C (μF)</label>
            <br>
            <input type="number" id="rlc-c">
            <br>
            
            <label for="rlc-f">F (Hz)</label>
            <br>
            <input type="number" id="rlc-f">
            <br>

            <label for="rlc-v">V (volt)</label>
            <br>
            <input type="number" id="rlc-v">
            <br>

            <button type="submit">Calculate</button>
        </form>
        <p id="rlc-result">rlc-result</p>
    </div>

    <div class="box">
        <h3>3) Equivalent Resistance</h3>
        <form id="equivalent-form">
            <label for="resistance-connection">Connection</label>
            <br>
            <select id="resistance-connection">
                <option value="series">Series</option>
                <option value="parallel">Parallel</option>
            </select>
            <br>

            <label for="values">Resistors</label>
            <br>
            <input type="text" id="values" placeholder="10, 20, 30">
            <br>

            <button type="submit">Calculate</button>
        </form>
        <p id="equivalent-result">equivalent-result</p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
